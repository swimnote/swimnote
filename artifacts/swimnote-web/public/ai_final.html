<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#F1F5F9; font-family:-apple-system,'Noto Sans KR',sans-serif;
       display:flex; gap:28px; justify-content:center; padding:28px; }
.label { text-align:center; font-size:11px; font-weight:700; color:#94A3B8;
          letter-spacing:0.8px; padding-bottom:8px; }
.label.new { color:#1B3A70; }
.phone {
  width:375px; background:#fff; border-radius:38px;
  box-shadow:0 18px 56px rgba(0,0,0,0.16); overflow:hidden; padding-bottom:20px;
}
.header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px 8px; }
.pool { font-size:14px; color:#64748B; }
.icons { display:flex; gap:4px; }
.ibtn { width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:10px; }
.tabs { display:flex; gap:8px; padding:4px 20px 0; }
.tab { padding:7px 16px; border-radius:20px; font-size:14px; border:1.5px solid; }
.tab.sel { background:#1B3A70; color:#fff; border-color:#1B3A70; }
.tab.add { background:#fff; color:#94A3B8; border-color:#CBD5E1; }
/* ── 현재 버튼 스타일 ── */
.ai-current { display:flex; gap:10px; padding:6px 20px 8px; }
.ai-btn-cur {
  flex:1; display:flex; flex-direction:row; align-items:center; justify-content:center;
  gap:6px; padding:11px 8px; border-radius:12px;
  border:1.5px solid #1B3A70; background:#fff;
}
.ai-btn-cur img { width:22px; height:22px; object-fit:contain; }
.ai-btn-cur span { font-size:12.5px; color:#1B3A70; font-weight:500; white-space:nowrap; }
/* ── 새 버튼 스타일: 아이콘 위, 텍스트 아래, 테두리/배경 없음 ── */
.ai-new { display:flex; flex-direction:row; gap:16px; padding:8px 20px 8px; }
.ai-btn-new {
  display:flex; flex-direction:column; align-items:center;
  background:transparent; border:none; cursor:pointer;
}
.ai-btn-new img { width:56px; height:56px; object-fit:contain; }
.ai-btn-new span { font-size:12px; color:#0F172A; margin-top:4px; white-space:nowrap; }
/* ── 공통 ── */
.banner {
  margin:2px 20px 12px; border:1.5px solid #1B3A70; border-radius:12px;
  padding:13px 16px; text-align:center; color:#1B3A70;
  font-size:13px; font-weight:600; background:#fff;
}
.sep { height:1px; background:#E2E8F0; margin:0 0 12px; }
.dd { font-size:15px; font-weight:700; color:#0F172A; padding:0 20px 2px; }
.ds { font-size:12px; color:#64748B; padding:0 20px 6px; }
</style></head><body>
